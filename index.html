<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Concentric Circle Visualization</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="plugins/d3.min.js"></script>
    <script src="plugins/d3-annotation.min.js"></script>
    <script src="plugins/webfont.js"></script>
    <script src="js/main.js"></script>
</head>
<body>
    <div id="chart-container">
        <div id="chart"></div>
    </div>

    <script>
        WebFont.load({
            google: {
                families: ["Barlow Semi Condensed:400,400i,600", "Barlow:400"]
            },
            custom: {
                families: ["Anime Ace"]
            },
            active: function() {
                setTimeout(create_CCS_chart, 200);
            }
        });

        var current_width = window.innerWidth;
        var eventTimeout;
        d3.select(window).on("resize", function() {
            if (window.innerWidth !== current_width) {
                current_width = window.innerWidth;
                if (!eventTimeout) {
                    eventTimeout = setTimeout(function() {
                        eventTimeout = null;
                        create_CCS_chart();
                    }, 300);
                }
            }
        });
    </script>
</body>
</html>
