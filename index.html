<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>纹落紫禁：故宫窗棂纹样分布数据可视化</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="plugins/d3.min.js"></script>
    <script src="plugins/d3-annotation.min.js"></script>
    <script src="plugins/webfont.js"></script>
    <script src="js/main.js"></script>
    <script src="js/lineage.js"></script>
    <script src="js/origin.js"></script>
</head>
<body class="landing-active">
    <div id="landing-screen" class="landing-screen">
        <div class="landing-content landing-cover-content">
            <h1 class="landing-cover-title">纹落紫禁</h1>
            <p class="landing-cover-subtitle">北京故宫窗棂与裙板纹样分布数据可视化</p>
            <button id="start-visualization" class="start-button" type="button">开始</button>
        </div>
    </div>
    <span id="page-ripple" class="landing-ripple" aria-hidden="true"></span>

    <nav class="lantern-nav" aria-label="页面导航">
        <button class="lantern-nav-button" type="button" data-page="origin">
            <img class="lantern-nav-icon" src="datas/imgs/art_design/navigation1.png" alt="" aria-hidden="true">
            <span class="lantern-nav-label">形制解析</span>
        </button>
        <button class="lantern-nav-button" type="button" data-page="chart">
            <img class="lantern-nav-icon" src="datas/imgs/art_design/navigation1.png" alt="" aria-hidden="true">
            <span class="lantern-nav-label">空间分布</span>
        </button>
        <button class="lantern-nav-button" type="button" data-page="lineage">
            <img class="lantern-nav-icon" src="datas/imgs/art_design/navigation1.png" alt="" aria-hidden="true">
            <span class="lantern-nav-label">衍生谱系</span>
        </button>
    </nav>

    <section id="origin-container" class="origin-container" aria-hidden="true"></section>

    <div id="chart-container">
        <div id="chart"></div>
    </div>
    <button id="chart-lineage-button" class="chart-lineage-button" type="button" aria-label="深究纹样衍变，跳转到衍生谱系" aria-hidden="true">
        <img src="datas/imgs/art_design/button1.png" alt="" aria-hidden="true">
        <span class="chart-lineage-button-label" aria-hidden="true">深究纹样衍变</span>
    </button>

    <section id="lineage-container" class="lineage-container" aria-hidden="true">
        <div class="lineage-content-wrap">
            <div class="lineage-main">
                <div class="lineage-main-header">
                    <div id="lineage-view-switch" class="lineage-view-switch" role="group" aria-label="衍生类型切换">
                        <button type="button" class="lineage-view-button is-active" data-lineage-view="pattern">窗棂</button>
                        <button type="button" class="lineage-view-button" data-lineage-view="apron">裙板</button>
                    </div>
                    <p id="lineage-main-description" class="lineage-sidebar-placeholder lineage-main-description">下图以节点分支形式，展现裙板基础纹样衍生出各类变体的谱系脉络</p>
                </div>
                <div class="lineage-stage">
                    <div class="lineage-stage-backdrop" aria-hidden="true"></div>
                    <div id="lineage-graph" class="lineage-graph" role="img" aria-label="裙板衍生谱系图"></div>
                </div>
            </div>
            <aside class="lineage-sidebar" aria-label="衍生谱系图片侧栏">
                <div class="lineage-sidebar-header">
                    <h2 class="lineage-sidebar-title">衍生谱系图录</h2>
                    <p id="lineage-sidebar-focus" class="lineage-sidebar-focus">当前焦点：全部变体</p>
                    <p class="lineage-sidebar-placeholder">点击节点可查看变体介绍、寓意与相关建筑</p>
                </div>
                <div id="lineage-gallery" class="lineage-gallery"></div>
            </aside>
        </div>
    </section>

    <script>
        function resolveLayoutScale() {
            var root_style = window.getComputedStyle(document.documentElement);
            var raw_value = root_style.getPropertyValue("--layout-scale");
            var parsed_value = parseFloat(raw_value);
            return parsed_value > 0 ? parsed_value : 1;
        }

        var layoutScale = resolveLayoutScale();
        window.APP_LAYOUT_SCALE = layoutScale;

        // Lock browser zoom by preventing Ctrl + wheel.
        (function lockPageZoom() {
            window.addEventListener("wheel", function(event) {
                if (event.ctrlKey) {
                    event.preventDefault();
                }
            }, { passive: false });
        })();

        // 首次渲染前等待字体加载完成，减少文字跳动和重排。
        WebFont.load({
            google: {
                families: ["Barlow Semi Condensed:400,400i,600", "Barlow:400"]
            },
            custom: {
                families: ["Anime Ace"]
            },
            active: function() {
                setTimeout(function() {
                    create_CCS_chart();
                    if (typeof create_apron_lineage_graph === "function") {
                        create_apron_lineage_graph();
                    }
                }, 200);
            }
        });

        // 仅在宽度变化时（防抖）重建图表，因为几何尺寸和标签布局都依赖宽度。
        var current_width = window.innerWidth / layoutScale;
        var eventTimeout;
        d3.select(window).on("resize", function() {
            var next_width = window.innerWidth / layoutScale;
            if (next_width !== current_width) {
                current_width = next_width;
                if (!eventTimeout) {
                    eventTimeout = setTimeout(function() {
                        eventTimeout = null;
                        create_CCS_chart();
                        if (typeof create_apron_lineage_graph === "function") {
                            create_apron_lineage_graph();
                        }
                    }, 300);
                }
            }
        });

        // 过渡流程：
        // 1) 点击“开始”按钮，播放背景中心放大并淡出的离场动画
        // 2) 点击“探索空间分布”按钮，从按钮中心触发三层波纹后切换页面
        (function setupLandingTransition() {
            var landingScreen = document.getElementById("landing-screen");
            var startButton = document.getElementById("start-visualization");
            var pageRipple = document.getElementById("page-ripple");
            var originContainer = document.getElementById("origin-container");
            var chartContainer = document.getElementById("chart-container");
            var chartLineageButton = document.getElementById("chart-lineage-button");
            var lineageContainer = document.getElementById("lineage-container");
            var navButtons = Array.prototype.slice.call(document.querySelectorAll(".lantern-nav-button"));
            if (!landingScreen || !startButton || !pageRipple) return;

            var hideLandingTimer = null;
            // 波纹动画独立计时器：仅控制波纹收尾，不阻塞页面切换。
            var pageRippleTimer = null;
            var chartLineageTransitionTimer = null;
            var chartLineageTransitionDuration = 720;
            var prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            var landingZoomDuration = prefersReducedMotion ? 0 : 1700;
            var pageRippleDuration = prefersReducedMotion ? 0 : 1520;

            function clearHideLandingTimer() {
                if (hideLandingTimer) {
                    window.clearTimeout(hideLandingTimer);
                    hideLandingTimer = null;
                }
            }

            function clearPageRippleTimer() {
                if (pageRippleTimer) {
                    window.clearTimeout(pageRippleTimer);
                    pageRippleTimer = null;
                }
            }

            function clearChartLineageTransitionTimer() {
                if (chartLineageTransitionTimer) {
                    window.clearTimeout(chartLineageTransitionTimer);
                    chartLineageTransitionTimer = null;
                }
            }

            function resetChartLineageTransitionState() {
                if (chartLineageButton) {
                    chartLineageButton.classList.remove("is-spinning");
                    chartLineageButton.disabled = false;
                    chartLineageButton.removeAttribute("aria-disabled");
                }
            }

            function setActiveNav(page) {
                navButtons.forEach(function(button) {
                    var isActive = button.getAttribute("data-page") === page;
                    button.classList.toggle("is-active", isActive);
                    if (isActive) {
                        button.setAttribute("aria-current", "page");
                        button.setAttribute("aria-disabled", "true");
                        button.disabled = true;
                    } else {
                        button.removeAttribute("aria-current");
                        button.removeAttribute("aria-disabled");
                        button.disabled = false;
                    }
                });
            }

            function setActiveContentPage(page) {
                var targetPage = page || "origin";
                var showOrigin = targetPage === "origin";
                var showChart = targetPage === "chart";
                var showLineage = targetPage === "lineage";

                if (originContainer) {
                    originContainer.classList.toggle("is-active", showOrigin);
                    originContainer.setAttribute("aria-hidden", showOrigin ? "false" : "true");
                }

                if (chartContainer) {
                    chartContainer.classList.toggle("page-hidden", !showChart);
                    if (showChart) {
                        create_CCS_chart();
                    }
                }

                if (chartLineageButton) {
                    chartLineageButton.classList.toggle("is-visible", showChart);
                    chartLineageButton.setAttribute("aria-hidden", showChart ? "false" : "true");
                }

                if (!showChart) {
                    clearChartLineageTransitionTimer();
                    resetChartLineageTransitionState();
                }

                if (lineageContainer) {
                    lineageContainer.classList.toggle("is-active", showLineage);
                    lineageContainer.setAttribute("aria-hidden", showLineage ? "false" : "true");
                }

                if (showLineage && typeof create_apron_lineage_graph === "function") {
                    create_apron_lineage_graph();
                }

                if (typeof window.set_origin_page_visibility === "function") {
                    window.set_origin_page_visibility(showOrigin);
                }
            }

            function applyPageState(nextPage) {
                document.body.classList.remove("landing-active");
                setActiveContentPage(nextPage);
                setActiveNav(nextPage);
            }

            function runRippleFromPoint(centerX, centerY, onDone, customRadius) {
                var viewportWidth = window.innerWidth / layoutScale;
                var viewportHeight = window.innerHeight / layoutScale;
                var maxX = Math.max(centerX, viewportWidth - centerX);
                var maxY = Math.max(centerY, viewportHeight - centerY);
                var rippleRadius = Math.hypot(maxX, maxY);
                // 允许外部传入半径（用于“略小于外圈”的视觉要求）。
                if (typeof customRadius === "number" && customRadius > 0) {
                    rippleRadius = customRadius;
                }
                var diameter = rippleRadius * 2;

                pageRipple.style.width = diameter + "px";
                pageRipple.style.height = diameter + "px";
                pageRipple.style.left = (centerX - rippleRadius) + "px";
                pageRipple.style.top = (centerY - rippleRadius) + "px";
                pageRipple.classList.remove("animate");
                void pageRipple.offsetWidth;
                pageRipple.classList.add("animate");

                if (!onDone) return;
                clearPageRippleTimer();
                if (pageRippleDuration === 0) {
                    onDone();
                    return;
                }

                pageRippleTimer = window.setTimeout(function() {
                    pageRippleTimer = null;
                    onDone();
                }, pageRippleDuration);
            }

            function hideLandingPage(withZoom, targetPage) {
                var nextPage = targetPage || "origin";
                clearPageRippleTimer();

                if (landingScreen.classList.contains("is-hidden")) {
                    applyPageState(nextPage);
                    return;
                }

                if (!withZoom) {
                    clearHideLandingTimer();
                    landingScreen.classList.remove("is-leaving", "is-zooming");
                    landingScreen.classList.add("is-hidden");
                    applyPageState(nextPage);
                    return;
                }

                if (landingScreen.classList.contains("is-leaving")) return;
                clearHideLandingTimer();
                landingScreen.classList.add("is-zooming");
                landingScreen.classList.add("is-leaving");

                if (landingZoomDuration === 0) {
                    landingScreen.classList.add("is-hidden");
                    applyPageState(nextPage);
                    return;
                }

                hideLandingTimer = window.setTimeout(function() {
                    landingScreen.classList.add("is-hidden");
                    applyPageState(nextPage);
                    hideLandingTimer = null;
                }, landingZoomDuration);
            }

            function openPageWithRipple(targetPage) {
                var nextPage = targetPage || "chart";
                var viewportWidth = window.innerWidth / layoutScale;
                var viewportHeight = window.innerHeight / layoutScale;
                var centerX = viewportWidth / 2;
                var centerY = viewportHeight / 2;
                // 与主图相同的响应式宽度基准（见 create_CCS_chart）。
                var chartBaseWidth = 1600;
                var chartWidth = Math.round(Math.min(chartBaseWidth, Math.max(320, viewportWidth * 0.96)));
                // 主可视化外圈半径：main.js 中 rad_card_label = width * 0.4。
                var chartOuterRingRadius = chartWidth * 0.4;
                // 波纹半径略小于外圈，避免超出主可视化边界。
                var rippleRadius = chartOuterRingRadius * 0.96;

                // 波纹作为过渡缓冲：先启动波纹，再并行切页与渲染。
                runRippleFromPoint(centerX, centerY, null, rippleRadius);
                window.setTimeout(function() {
                    hideLandingPage(false, nextPage);
                }, 0);
            }

            document.body.classList.add("landing-active");
            setActiveContentPage("origin");
            setActiveNav("origin");

            startButton.addEventListener("click", function() {
                hideLandingPage(true, "origin");
            });

            navButtons.forEach(function(button) {
                button.addEventListener("click", function() {
                    var targetPage = button.getAttribute("data-page");
                    hideLandingPage(false, targetPage);
                });
            });

            if (chartLineageButton) {
                chartLineageButton.addEventListener("click", function() {
                    if (!chartContainer || chartContainer.classList.contains("page-hidden")) return;
                    if (chartLineageButton.disabled) return;

                    clearChartLineageTransitionTimer();
                    chartLineageButton.disabled = true;
                    chartLineageButton.setAttribute("aria-disabled", "true");
                    chartLineageButton.classList.add("is-spinning");

                    chartLineageTransitionTimer = window.setTimeout(function() {
                        chartLineageTransitionTimer = null;
                        hideLandingPage(false, "lineage");
                    }, chartLineageTransitionDuration);
                });
            }

            window.addEventListener("origin:go-chart", function(event) {
                var detail = event && event.detail ? event.detail : null;
                var withRipple = !detail || detail.withRipple !== false;
                if (!withRipple) {
                    hideLandingPage(false, "chart");
                    return;
                }
                openPageWithRipple("chart");
            });
        })();
    </script>
</body>
</html>
