<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>纹落紫禁：故宫窗棂纹样分布数据可视化</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="plugins/d3.min.js"></script>
    <script src="plugins/d3-annotation.min.js"></script>
    <script src="plugins/webfont.js"></script>
    <script src="js/main.js"></script>
</head>
<body>
    <div id="landing-screen" class="landing-screen">
        <div class="landing-content landing-cover-content">
            <h1 class="landing-cover-title">纹落紫禁</h1>
            <p class="landing-cover-subtitle">北京故宫窗棂与裙板纹样分布数据可视化</p>
            <button id="start-visualization" class="start-button" type="button">开始</button>
        </div>
        <span id="landing-ripple" class="landing-ripple" aria-hidden="true"></span>
    </div>

    <nav class="lantern-nav" aria-label="页面导航">
        <button class="lantern-nav-button is-active" type="button" data-page="landing" aria-current="page">
            <img class="lantern-nav-icon" src="datas/imgs/art_design/navigation1.png" alt="" aria-hidden="true">
            <span class="lantern-nav-label">引导页</span>
        </button>
        <button class="lantern-nav-button" type="button" data-page="chart">
            <img class="lantern-nav-icon" src="datas/imgs/art_design/navigation1.png" alt="" aria-hidden="true">
            <span class="lantern-nav-label">图谱页</span>
        </button>
    </nav>

    <div id="chart-container">
        <div id="chart"></div>
    </div>

    <script>
        // 首次渲染前等待字体加载完成，减少文字跳动和重排。
        WebFont.load({
            google: {
                families: ["Barlow Semi Condensed:400,400i,600", "Barlow:400"]
            },
            custom: {
                families: ["Anime Ace"]
            },
            active: function() {
                setTimeout(create_CCS_chart, 200);
            }
        });

        // 仅在宽度变化时（防抖）重建图表，因为几何尺寸和标签布局都依赖宽度。
        var current_width = window.innerWidth;
        var eventTimeout;
        d3.select(window).on("resize", function() {
            if (window.innerWidth !== current_width) {
                current_width = window.innerWidth;
                if (!eventTimeout) {
                    eventTimeout = setTimeout(function() {
                        eventTimeout = null;
                        create_CCS_chart();
                    }, 300);
                }
            }
        });

        // 落地页流程：
        // 1) 点击开始按钮
        // 2) 计算可覆盖整个视口的波纹半径
        // 3) 播放过渡动画并隐藏落地页
        (function setupLandingTransition() {
            var landingScreen = document.getElementById("landing-screen");
            var startButton = document.getElementById("start-visualization");
            var landingRipple = document.getElementById("landing-ripple");
            var navButtons = Array.prototype.slice.call(document.querySelectorAll(".lantern-nav-button"));
            if (!landingScreen || !startButton || !landingRipple) return;

            var hideLandingTimer = null;

            function setActiveNav(page) {
                navButtons.forEach(function(button) {
                    var isActive = button.getAttribute("data-page") === page;
                    button.classList.toggle("is-active", isActive);
                    if (isActive) {
                        button.setAttribute("aria-current", "page");
                    } else {
                        button.removeAttribute("aria-current");
                    }
                });
            }

            function showLandingPage() {
                if (hideLandingTimer) {
                    window.clearTimeout(hideLandingTimer);
                    hideLandingTimer = null;
                }
                landingRipple.classList.remove("animate");
                landingScreen.classList.remove("is-hidden", "is-leaving");
                document.body.classList.add("landing-active");
                setActiveNav("landing");
            }

            function hideLandingPage(withRipple) {
                if (landingScreen.classList.contains("is-hidden")) {
                    document.body.classList.remove("landing-active");
                    setActiveNav("chart");
                    return;
                }

                if (!withRipple) {
                    if (hideLandingTimer) {
                        window.clearTimeout(hideLandingTimer);
                        hideLandingTimer = null;
                    }
                    landingScreen.classList.remove("is-leaving");
                    landingScreen.classList.add("is-hidden");
                    document.body.classList.remove("landing-active");
                    setActiveNav("chart");
                    return;
                }

                if (landingScreen.classList.contains("is-leaving")) return;

                var buttonRect = startButton.getBoundingClientRect();
                var centerX = buttonRect.left + buttonRect.width / 2;
                var centerY = buttonRect.top + buttonRect.height / 2;
                var maxX = Math.max(centerX, window.innerWidth - centerX);
                var maxY = Math.max(centerY, window.innerHeight - centerY);
                var rippleRadius = Math.hypot(maxX, maxY);
                var diameter = rippleRadius * 2;

                // 让波纹圆心与按钮中心对齐。
                landingRipple.style.width = diameter + "px";
                landingRipple.style.height = diameter + "px";
                landingRipple.style.left = (centerX - rippleRadius) + "px";
                landingRipple.style.top = (centerY - rippleRadius) + "px";

                // 通过强制回流重启动画，确保每次点击都能播放。
                landingRipple.classList.remove("animate");
                void landingRipple.offsetWidth;
                landingRipple.classList.add("animate");
                landingScreen.classList.add("is-leaving");

                // 延时与 CSS 过渡/波纹时长保持一致。
                hideLandingTimer = window.setTimeout(function() {
                    landingScreen.classList.add("is-hidden");
                    document.body.classList.remove("landing-active");
                    setActiveNav("chart");
                    hideLandingTimer = null;
                }, 1400);
            }

            document.body.classList.add("landing-active");
            setActiveNav("landing");

            startButton.addEventListener("click", function() {
                hideLandingPage(true);
            });

            navButtons.forEach(function(button) {
                button.addEventListener("click", function() {
                    if (button.getAttribute("data-page") === "landing") {
                        showLandingPage();
                    } else {
                        hideLandingPage(false);
                    }
                });
            });
        })();
    </script>
</body>
</html>
